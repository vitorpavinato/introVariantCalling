name: intro-variant-calling
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- Ferramentas de bioinformática (Data Carpentry - Wrangling Genomics) ---
  # A aula começa em samtools (assume-se que os alunos já viram read mapping),
  # por isso bwa NÃO entra no Binder — o alinhamento foi feito na preparação.
  - samtools=1.22       # manipulação de SAM/BAM
  - bcftools=1.22       # chamada e filtragem de variantes (VCF)
  # --- Jupyter + kernel Bash ---
  - python=3.11
  - jupyterlab
  - notebook
  - pip
  - pip:
      - bash_kernel     # permite rodar células em Bash (idêntico ao terminal)
