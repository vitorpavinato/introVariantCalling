name: intro-variant-calling
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- Ferramentas de bioinformática (Data Carpentry - Wrangling Genomics) ---
  - bwa=0.7.17          # alinhamento de reads ao genoma de referência
  - samtools=1.9        # manipulação de SAM/BAM
  - bcftools=1.8        # chamada e filtragem de variantes (VCF)
  # --- Utilitários ---
  - wget                # download dos dados
  # --- Jupyter + kernel Bash ---
  - python=3.11
  - jupyterlab
  - notebook
  - pip
  - pip:
      - bash_kernel     # permite rodar células em Bash (idêntico ao terminal)
